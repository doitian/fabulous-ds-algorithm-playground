name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      # Windows runners check out with CRLF line endings, which zig fmt reports as unformatted.
      - if: runner.os == 'Linux'
        run: zig fmt --check build.zig build.zig.zon src
      - run: zig build test --summary all
